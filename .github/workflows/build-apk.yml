name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run game engine checks
        run: |
          mkdir -p build/checks
          javac -d build/checks app/src/main/java/com/stepan/skyboundrunner/RunnerEngine.java tools/RunnerEngineChecks.java
          java -cp build/checks com.stepan.skyboundrunner.RunnerEngineChecks

      - name: Build and verify debug APK
        run: bash tools/build_with_sdk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: SkyboundRunner-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
